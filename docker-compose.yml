version: "3.9"

services:
  traefik:
    image: traefik:v3.0
    command:
      - "--api.insecure=true"  # Dashboard Traefik
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=ton.email@example.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - symfony

  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://btdemande:btdemande@db:3306/btdemande?serverVersion=mariadb-11.4.0&charset=utf8mb4
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ministral-3:3b
    depends_on:
      - db
      - ollama
    networks:
      - symfony

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - php
    networks:
      - symfony
    labels:
      # Router HTTPS
      - "traefik.enable=true"
      - "traefik.http.routers.fidelissimo.rule=Host(`fidelissimo.fr`)"
      - "traefik.http.routers.fidelissimo.entrypoints=websecure"
      - "traefik.http.routers.fidelissimo.tls.certresolver=letsencrypt"
      - "traefik.http.services.fidelissimo.loadbalancer.server.port=80"

      # Router HTTP → redirige vers HTTPS
      - "traefik.http.routers.fidelissimo-http.rule=Host(`fidelissimo.fr`)"
      - "traefik.http.routers.fidelissimo-http.entrypoints=web"
      - "traefik.http.routers.fidelissimo-http.middlewares=redirect-https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: btdemande
      MARIADB_USER: btdemande
      MARIADB_PASSWORD: btdemande
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - symfony

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: btdemande
      PMA_PASSWORD: btdemande
    networks:
      - symfony

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - symfony

volumes:
  db_data:
  ollama_data:
  traefik_letsencrypt:

networks:
  symfony: