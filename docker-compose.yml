version: "3.9"

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - uploads:/var/www/html/public/uploads/documents
      - var_data:/var/www/html/var
    environment:
      APP_ENV: prod
      DATABASE_URL: mysql://btdemande:btdemande@db:3306/btdemande?serverVersion=mariadb-11.4.0&charset=utf8mb4
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ministral-3:3b
      DEFAULT_URI: https://fidelissimo.fr
    depends_on:
      - db
      - ollama
    networks:
      - symfony

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "7070:80"
    volumes:
      - uploads:/var/www/html/public/uploads/documents:ro
      - ./docker/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - php
    networks:
      - symfony

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: btdemande
      MARIADB_USER: btdemande
      MARIADB_PASSWORD: btdemande
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - symfony

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: btdemande
      PMA_PASSWORD: btdemande
    ports:
      - "4040:80"
    depends_on:
      - db
    networks:
      - symfony

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - symfony

volumes:
  db_data:
  ollama_data:
  uploads:
  var_data:

networks:
  symfony: